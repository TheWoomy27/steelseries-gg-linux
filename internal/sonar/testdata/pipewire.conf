# Private PipeWire for Sonar tests: no hardware, a dummy clock, and two
# null devices standing in for a headset's output and microphone.
context.properties = {
    core.daemon = true
    core.name   = pipewire-0
    default.clock.rate = 48000
    support.dbus = false
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-spa-node-factory }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-client-device }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-link-factory }
    { name = libpipewire-module-access args = { access.socket = { pipewire-0 = "unrestricted" pipewire-0-manager = "unrestricted" } } }
]
context.objects = [
    { factory = spa-node-factory
      args = { factory.name = support.node.driver node.name = Dummy-Driver node.group = pipewire.dummy priority.driver = 20000 } }
    { factory = adapter
      args = { factory.name = support.null-audio-sink node.name = test_headset_output node.description = "Test Headset Output"
               media.class = Audio/Sink audio.position = [ FL FR ] monitor.channel-volumes = true } }
    { factory = adapter
      args = { factory.name = support.null-audio-sink node.name = test_headset_mic node.description = "Test Headset Mic"
               media.class = Audio/Source/Virtual audio.position = [ MONO ] } }
]
