name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.26.x', '1.27.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Use the installed Go toolchain
        run: echo 'GOTOOLCHAIN=local' >> "$GITHUB_ENV"
      - name: Install golisp's build dependencies
        run: sudo apt-get update && sudo apt-get install -y libreadline-dev
      - run: go vet ./...
      - run: go test ./...
      - name: Test installer dependencies
        run: |
          for script in setup.sh packaging/dependencies.sh packaging/install.sh packaging/steelseries-gg; do sh -n "$script"; done
          for test_shell in dash bash; do
            GG_TEST_SHELL="$test_shell" python3 packaging/dependencies_test.py
          done
      - name: Test the drag fix
        run: python3 packaging/dragfix_test.py
