name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.26.x', '1.27.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Use the installed Go toolchain
        run: echo 'GOTOOLCHAIN=local' >> "$GITHUB_ENV"
      - name: Install golisp's build dependencies
        run: sudo apt-get update && sudo apt-get install -y libreadline-dev
      - run: go vet ./...
      - run: go test ./...
      - name: Test installer dependencies
        run: |
          for script in setup.sh packaging/dependencies.sh packaging/install.sh packaging/udev.sh packaging/steelseries-gg packaging/appimage.sh packaging/appimage/AppRun; do sh -n "$script"; done
          for test_shell in dash bash; do
            GG_TEST_SHELL="$test_shell" python3 packaging/dependencies_test.py
            GG_TEST_SHELL="$test_shell" python3 packaging/udev_test.py
            GG_TEST_SHELL="$test_shell" python3 packaging/appimage_test.py
          done
          python3 packaging/install_test.py
      - name: Test the drag fix
        run: python3 packaging/dragfix_test.py
      - name: Test the client's Linux patches
        run: node --test client/linux/windows_test.js client/linux/patches_test.js
      - name: Check the AppImage's setup window and the GG update check
        run: |
          for f in packaging/appimage/firstrun/*.js tools/gg-check/*.js; do node --check "$f"; done
          sh -n tools/gg-check/check.sh
